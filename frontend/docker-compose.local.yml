services:
  digital-latin-streamlit-ui-chatapi:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    container_name: digital-latin-streamlit-ui-chatapi
    command: ["bash", "./entrypoint.sh"]
    ports:
      - "8502:8502"
    volumes:
      - ./app:/app
    environment:
      - SESSION_DB_BACKEND=${SESSION_DB_BACKEND}
      - WAIT_FOR_POSTGRES=true
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - SKIP_DB=${SKIP_DB}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_ALLOWED_MODELS=${GOOGLE_ALLOWED_MODELS}
      - GOOGLE_API_BASE_URL=${GOOGLE_API_BASE_URL}
      - FLOW_API_URL=${FLOW_API_URL}
      - STREAMLIT_AUTH_USERNAME=${STREAMLIT_AUTH_USERNAME}
      - STREAMLIT_AUTH_PASSWORD=${STREAMLIT_AUTH_PASSWORD}
      - AUTH_USER_1=${AUTH_USER_1}
      - AUTH_PASSWORD_1=${AUTH_PASSWORD_1}
      - AUTH_USER_2=${AUTH_USER_2}
      - AUTH_PASSWORD_2=${AUTH_PASSWORD_2}
      - AUTH_USER_3=${AUTH_USER_3}
      - AUTH_PASSWORD_3=${AUTH_PASSWORD_3}
    depends_on:
      - digital-latin-postgres
    networks:
      - digital-latin-shared-network

  digital-latin-postgres:
    image: postgres:13
    container_name: digital-latin-postgres
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - digital-latin-shared-network

volumes:
  pgdata:

networks:
  digital-latin-shared-network:
    external: true
