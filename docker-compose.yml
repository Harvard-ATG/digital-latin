services:
  digital-latin-streamlit-ui-chatapi:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: digital-latin-streamlit-ui-chatapi
    command: ["bash", "./entrypoint.sh"]
    ports:
      - "8502:8502"
    environment:
    # These environment variables are used to configure the Streamlit app and its dependencies.
      - SESSION_DB_BACKEND=${SESSION_DB_BACKEND}
      - WAIT_FOR_POSTGRES=true
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - SKIP_DB=${SKIP_DB}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_ALLOWED_MODELS=${GOOGLE_ALLOWED_MODELS}
      - GOOGLE_API_BASE_URL=${GOOGLE_API_BASE_URL}
      - FLOW_API_URL=${FLOW_API_URL}
      - AUTH_USER_1=${AUTH_USER_1}
      - AUTH_PASSWORD_1=${AUTH_PASSWORD_1}
      - AUTH_USER_2=${AUTH_USER_2}
      - AUTH_PASSWORD_2=${AUTH_PASSWORD_2}
      - AUTH_USER_3=${AUTH_USER_3}
      - AUTH_PASSWORD_3=${AUTH_PASSWORD_3}
    depends_on:
      - digital-latin-flow
      - digital-latin-postgres

  digital-latin-flow:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: digital-latin-flow
    command: ["bash", "./start.sh"]
    ports:
      - "8080:8080"
    environment:
      - AWS_AI_WORKFLOW_CORE_DEV_ID=${AWS_AI_WORKFLOW_CORE_DEV_ID}
      - AWS_AI_WORKFLOW_CORE_DEV_SECRET=${AWS_AI_WORKFLOW_CORE_DEV_SECRET}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL}
      - PYTHON_KEYRING_BACKEND=${PYTHON_KEYRING_BACKEND}
      - KEYRING_CRYPTFILE_PASSWORD=${KEYRING_CRYPTFILE_PASSWORD}

  digital-latin-postgres:
    image: postgres:13
    container_name: digital-latin-postgres
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
